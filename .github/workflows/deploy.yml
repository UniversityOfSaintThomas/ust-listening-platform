name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: check
    # Deploys only after setup is finished and the DEPLOY_ENABLED repository variable is set to true.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Find or create the database
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s.slice(s.indexOf("[")));
                const db = list.find(d => d.name === "listening");
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create listening > /dev/null
            ID=$(find_id)
          fi
          test -n "$ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply listening --remote

      - name: Deploy
        run: npx wrangler deploy --env=""

      - name: Sync secrets to Cloudflare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          REVIEWERS: ${{ secrets.REVIEWERS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          # The session signing secret is generated once and never leaves Cloudflare.
          if ! npx wrangler secret list | grep -q '"SESSION_SECRET"'; then
            SESSION_SECRET=$(openssl rand -base64 48)
            echo "::add-mask::$SESSION_SECRET"
            export SESSION_SECRET
          fi
          node -e '
            const out = {};
            for (const name of ["OPENAI_API_KEY", "TURNSTILE_SECRET", "REVIEWERS", "DASHBOARD_PASSWORD", "SESSION_SECRET"]) {
              if (process.env[name]) out[name] = process.env[name];
            }
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Syncing:", Object.keys(out).join(", ") || "nothing");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json
