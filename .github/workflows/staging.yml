name: Deploy staging

# Run by hand from the Actions tab. Deploys the chosen branch to the staging copy,
# which has its own address and database and never touches participant data.
on:
  workflow_dispatch:

jobs:
  staging:
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Find or create the staging database
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s.slice(s.indexOf("[")));
                const db = list.find(d => d.name === "listening-staging");
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create listening-staging > /dev/null
            ID=$(find_id)
          fi
          test -n "$ID"
          sed -i "s/11111111-1111-1111-1111-111111111111/$ID/" wrangler.jsonc

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply listening-staging --remote --env staging

      - name: Deploy
        run: npx wrangler deploy --env staging

      - name: Sync secrets to Cloudflare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if ! npx wrangler secret list --env staging | grep -q '"SESSION_SECRET"'; then
            SESSION_SECRET=$(openssl rand -base64 48)
            echo "::add-mask::$SESSION_SECRET"
            export SESSION_SECRET
          fi
          node -e '
            const out = {};
            for (const name of ["OPENAI_API_KEY", "DASHBOARD_PASSWORD", "SESSION_SECRET"]) {
              if (process.env[name]) out[name] = process.env[name];
            }
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Syncing:", Object.keys(out).join(", ") || "nothing");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json --env staging; fi
          rm -f secrets.json
